<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Top Ghost Hunterz players on every haunted map and the Midnight Route.">
<title>Ghost Hunterz Leaderboard</title>
<style>
  :root {
    color-scheme: dark;
    --ink: #0a0d20; --panel: #16223a; --panel-2: #111b30; --tab: #26344d; --line: #2c3b57;
    --mint: #8effd9; --gold: #ffd784; --white: #f0f7ff; --muted: #b9c9dd; --pink: #ff7ea8;
    --silver: #d7e0ea; --bronze: #e6a46e;
    --font: "Roboto Condensed", "Arial Narrow", "Sofia Sans Condensed", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html { background: var(--ink); }
  body {
    margin: 0; min-height: 100vh; color: var(--white); font: 17px/1.5 var(--font); font-stretch: condensed;
    background:
      radial-gradient(1200px 500px at 50% 110%, rgba(123, 223, 214, .10), transparent 70%),
      radial-gradient(900px 420px at 85% -10%, rgba(120, 90, 200, .22), transparent 70%),
      radial-gradient(700px 380px at 5% 0%, rgba(60, 120, 160, .20), transparent 70%),
      var(--ink);
  }
  main { max-width: 980px; margin: 0 auto; padding: 36px 20px 48px; }
  header { text-align: center; margin-bottom: 26px; }
  .studio { margin: 0; color: var(--mint); font-weight: 700; letter-spacing: .14em; font-size: 14px; }
  h1 { margin: 4px 0 0; font-size: clamp(40px, 9vw, 76px); line-height: 1; font-weight: 800; letter-spacing: .01em; }
  h1 .ghost { color: var(--white); }
  h1 .hunterz { color: var(--mint); }
  .subtitle { margin: 10px 0 0; color: var(--gold); font-weight: 700; font-size: clamp(18px, 3.4vw, 24px); letter-spacing: .08em; }

  .tabs { display: grid; gap: 10px; margin: 0 0 12px; }
  .tabs[hidden] { display: none; }
  .maps { grid-template-columns: repeat(7, 1fr); }
  .diffs { grid-template-columns: repeat(3, minmax(0, 150px)); }
  .tabs button {
    font: inherit; font-weight: 700; font-size: 16px; letter-spacing: .03em; color: var(--white); background: var(--tab);
    border: 0; border-radius: 14px; padding: 11px 6px; cursor: pointer; box-shadow: 0 4px 0 rgba(0, 0, 0, .35);
    transition: transform .08s, background .15s;
  }
  .tabs button:hover { background: #31425f; }
  .tabs button:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0, 0, 0, .35); }
  .tabs button:focus-visible, .refresh:focus-visible { outline: 3px solid var(--white); outline-offset: 2px; }
  .maps button[aria-pressed="true"] { background: var(--mint); color: var(--ink); }
  .diffs button[aria-pressed="true"] { background: var(--gold); color: var(--ink); }

  .board-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; margin: 18px 2px 10px; }
  .board-name { margin: 0; font-size: clamp(22px, 4vw, 30px); font-weight: 800; }
  .board-name small { display: block; color: var(--mint); font-size: 15px; font-weight: 700; letter-spacing: .05em; }
  .count { color: var(--gold); font-weight: 700; font-size: 18px; }

  .card { background: rgba(16, 25, 45, .85); border: 1px solid var(--line); border-radius: 20px; padding: 10px; min-height: 260px; }
  ol { list-style: none; margin: 0; padding: 0; }
  li {
    display: grid; grid-template-columns: 64px 48px minmax(0, 1fr) auto; align-items: center; gap: 12px;
    padding: 6px 18px 6px 14px; border-radius: 14px; min-height: 58px;
  }
  li:nth-child(odd) { background: rgba(22, 34, 58, .9); }
  li:nth-child(even) { background: rgba(22, 34, 58, .45); }
  .rank { font-weight: 800; font-size: 24px; font-variant-numeric: tabular-nums; }
  li.r1 .rank { color: var(--gold); } li.r2 .rank { color: var(--silver); } li.r3 .rank { color: var(--bronze); }
  li.r1 { box-shadow: inset 0 0 0 2px rgba(255, 215, 132, .55); }
  .icon { width: 48px; height: 48px; display: block; }
  .name { font-weight: 700; font-size: 22px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .score { color: var(--gold); font-weight: 800; font-size: 24px; font-variant-numeric: tabular-nums; text-align: right; }

  .state { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; min-height: 240px; text-align: center; font-size: 24px; font-weight: 700; }
  .state.empty { color: var(--mint); }
  .state.loading { color: var(--muted); }
  .refresh {
    font: inherit; font-weight: 700; font-size: 17px; letter-spacing: .03em; color: var(--ink); background: var(--mint);
    border: 0; border-radius: 14px; padding: 11px 22px; cursor: pointer; box-shadow: 0 4px 0 rgba(0, 0, 0, .35);
  }
  .refresh:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0, 0, 0, .35); }
  .refresh[disabled] { opacity: .6; cursor: default; }
  .below { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-top: 14px; color: var(--muted); font-size: 16px; }

  footer { margin-top: 34px; text-align: center; color: var(--muted); font-size: 15px; line-height: 1.6; }
  footer a { color: var(--mint); text-underline-offset: 3px; }

  @media (max-width: 720px) {
    main { padding: 24px 16px 40px; }
    /* Six maps in two rows of three, ARCADE across the full width below. */
    .maps { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .maps button:last-child { grid-column: 1 / -1; }
    .diffs { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .tabs button { font-size: 14px; padding: 10px 2px; }
    .card { padding: 6px; }
    li { grid-template-columns: 38px 36px minmax(0, 1fr) auto; gap: 8px; padding: 6px 10px 6px 8px; min-height: 52px; }
    .icon { width: 36px; height: 36px; }
    .rank { font-size: 18px; } .score { font-size: 18px; }
    .name { font-size: 17px; line-height: 1.2; white-space: normal; }
  }
  @media (prefers-reduced-motion: reduce) { .tabs button, .refresh { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <p class="studio">KAZTECH GAMES</p>
    <h1><span class="ghost">GHOST</span> <span class="hunterz">HUNTERZ</span></h1>
    <p class="subtitle">LEADERBOARD</p>
  </header>

  <nav class="tabs maps" id="maps" aria-label="Haunted place"></nav>
  <nav class="tabs diffs" id="diffs" aria-label="Difficulty"></nav>

  <div class="board-head">
    <h2 class="board-name" id="boardName"></h2>
    <span class="count" id="count"></span>
  </div>
  <section class="card" aria-live="polite" id="card"></section>
  <div class="below">
    <span id="updated"></span>
    <button class="refresh" id="refresh" type="button">REFRESH ↻</button>
  </div>

  <footer>
    Ghost Tags are made from word lists inside the game: no real names, no typing.<br>
    Scores shown are each player's best. Players can leave the leaderboard any time in the game.<br>
    <a href="https://kaztech99.com/ghost-hunterz-privacy.html">Privacy Policy</a>
  </footer>
</main>

  let map = 0, diff = 0, request = null;
  const $ = id => document.getElementById(id);

  function boardId() { return map === 6 ? "arcade" : `m${map}-${DIFFS[diff].toLowerCase()}`; }
  function tagName(t) {
    const a = ADJECTIVES[t.adj], n = NOUNS[t.noun];
    return a && n ? `${a} ${n} ${String(t.num).padStart(2, "0")}` : "Mystery Ghost";
  }
  function points(n) { return n.toLocaleString("en-US"); }

  function tabs(container, labels, selected, pick) {
    container.replaceChildren(...labels.map((label, i) => {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = label; b.setAttribute("aria-pressed", String(i === selected));
      b.addEventListener("click", () => pick(i));
      return b;
    }));
  }
  function drawTabs() {
    tabs($("maps"), MAPS.map(m => m[0]), map, i => { if (i !== map) { map = i; load(); } });
    tabs($("diffs"), DIFFS, diff, i => { if (i !== diff) { diff = i; load(); } });
    $("diffs").hidden = map === 6;
    const name = $("boardName");
    name.textContent = MAPS[map][1];
    const sub = document.createElement("small");
    sub.textContent = map === 6 ? "TOTAL SCORE FOR A COMPLETE ROUTE" : DIFFS[diff];
    name.append(sub);
  }

  function state(kind, text, retry) {
    const box = document.createElement("div");
    box.className = `state ${kind}`; box.textContent = text;
    if (retry) {
      const b = document.createElement("button");
      b.className = "refresh"; b.type = "button"; b.textContent = "TRY AGAIN"; b.addEventListener("click", load);
      box.append(b);
    }
    $("card").replaceChildren(box);
  }

  function show(data) {
    $("count").textContent = data.total === 1 ? "1 PLAYER" : `${points(data.total)} PLAYERS`;
    if (!data.top.length) { state("empty", "No scores yet. Be the first!"); return; }
    const list = document.createElement("ol");
    for (const e of data.top) {
      const row = document.createElement("li");
      if (e.rank <= 3) row.className = `r${e.rank}`;
      const rank = document.createElement("span"); rank.className = "rank"; rank.textContent = `#${e.rank}`;
      const icon = document.createElement("img");
      icon.className = "icon"; icon.alt = ""; icon.width = 48; icon.height = 48; icon.src = ICONS[e.tag.icon] || ICONS[0];
      const name = document.createElement("span"); name.className = "name"; name.textContent = tagName(e.tag);
      const score = document.createElement("span"); score.className = "score"; score.textContent = points(e.score);
      row.append(rank, icon, name, score);
      list.append(row);
    }
    $("card").replaceChildren(list);
  }

  async function load() {
    drawTabs();
    history.replaceState(null, "", `#${boardId()}`);
    if (request) request.abort();
    const mine = request = new AbortController();
    $("count").textContent = ""; $("updated").textContent = ""; $("refresh").disabled = true;
    state("loading", "Summoning scores…");
    try {
      const r = await fetch(`${API}/v1/boards/${boardId()}?limit=${TOP}&channel=live`, { signal: mine.signal, cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      const data = await r.json();
      if (mine !== request) return;
      show(data);
      $("updated").textContent = `Updated ${new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}`;
    } catch (err) {
      if (mine !== request) return;
      $("count").textContent = "";
      state("error", "Can't reach the leaderboard right now.", true);
    } finally {
      if (mine === request) $("refresh").disabled = false;
    }
  }

  // Links like ghost-hunterz-leaderboard.html#m2-hard or #arcade open that board.
  function fromHash() {
    const h = location.hash.slice(1);
    if (h === "arcade") { map = 6; return; }
    const m = /^m([0-5])-(easy|medium|hard)$/.exec(h);
    if (m) { map = Number(m[1]); diff = DIFFS.indexOf(m[2].toUpperCase()); }
  }
  $("refresh").addEventListener("click", load);
  fromHash();
  load();
</script>
